app:
  applicationId: a919a264-de99-4087-b3b4-5939104caf9f
  env: Development
  host: http://localhost:3000

  # GraphQL Configuration for comprehensive testing
  graphqlConf:
    enabled: true
    schemaPath: /graphql
    requestMethod: POST
    uriMaxLength: "4000"
    maxDepth: "7"
    introspection:
      requestsPerCycle: "10"
      requestDelay: "1000"
    batchQueries: false
    operation: ALL
    filePath: ""

  # Authentication and session management configuration
  authentication:
    sessionManagement:
      sessionTokenPath:
        - "$.token"
        - "$.data.token"
        - "$.data.access_token"

# Security testing configuration
hawk:
  # Set failure threshold to high for security-focused scanning
  failureThreshold: high
  
  # Enable comprehensive spider configuration
  spider:
    maxDuration: 10
    
  # Enable additional security testing rules
  policy:
    - passive-scan-rules
    - active-scan-rules
    - injection-rules
    - xss-rules
    - authentication-rules
    - authorization-rules
